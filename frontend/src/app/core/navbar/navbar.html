<header class="navbar">
  <a routerLink="/home" class="logo">
    <img ngSrc="/logo.png" alt="PoseCoach" height="232" width="966" priority="" />
  </a>

  <nav class="menu">
    <a routerLink="/home" routerLinkActive="active">Inicio</a>
    <a routerLink="/exercises" routerLinkActive="active">Ejercicios</a>
    <a routerLink="/favorites" routerLinkActive="active">Favoritos</a>
  </nav>

  <div class="avatar-wrap">
    <button
      class="avatar"
      type="button"
      aria-label="Cuenta"
      [class.open]="menuOpen()"
      (click)="toggleMenu()"
    >
      <svg
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <circle cx="12" cy="8" r="4" />
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
      </svg>
    </button>

    @if (menuOpen()) {
      <div class="dropdown">
        <a routerLink="/profile" class="dropdown-item" (click)="closeMenu()">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
          </svg>
          Mi perfil
        </a>
        <button type="button" class="dropdown-item" (click)="closeMenu()">
          <svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3" />
            <path d="M10 12H3" />
            <path d="M6 8l-4 4 4 4" />
          </svg>
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>
